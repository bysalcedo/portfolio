name: Daniel Salcedo
headline: Ingeniero cloud y de plataforma
location: Cantabria, España · Remoto o híbrido
now: >-
  Desde 2019 trabajo en el departamento Multicloud de Minsait (Indra) como Technical Lead y
  arquitecto cloud. Llevo un equipo de cuatro ingenieros y soy el referente técnico del
  departamento. Diseño landing zones en Azure, AWS, Google Cloud y OCI conectadas a los servicios
  corporativos de red, seguridad, monitorización y backup, y las despliego como código con
  Terraform y pipelines CI/CD. En 2026 dirigí la apertura de dos regiones nuevas en cada uno de
  AWS, Azure y Google Cloud. También conecto centros de datos con la nube, ajusto el gasto con
  FinOps y diseño entornos Zero Trust que cumplen GDPR, ISO 27001 y SOC 2.
home: >-
  Opero Ebro como si fuera producción: un cluster RKE2 de seis nodos sobre tres hosts
  Proxmox, con unas treinta aplicaciones desplegadas por GitOps con ArgoCD, SSO con Authentik en
  todas, backups con Velero que se restauran solos cada semana y ningún puerto abierto a internet.
  Lo que aprendo ahí está en los casos y los postmortems de esta web.
before: >-
  De 2016 a 2019 fui técnico de sistemas en Io Digital X: entornos en AWS y Azure,
  servidores Linux y Windows y la migración del correo a Office 365.
